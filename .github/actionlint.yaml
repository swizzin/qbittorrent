# actionlint configuration.
#
# Only the znver3 legs still name the self-hosted runner (as a matrix value, so
# actionlint cannot see the label): it is labelled with the CPU
# microarchitecture it has, because a znver3 binary cannot be built or smoked on
# anything older. The baseline legs run on GitHub-hosted runners.
self-hosted-runner:
  labels:
    - znver3
