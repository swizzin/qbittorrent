name: pull request

# Pull-request CI: the only checks a fork can start, and the only place it can
# start them.
#
# Every step runs on a GitHub-hosted runner and needs no secret. Nothing is
# built, nothing is pushed, and this workflow never selects the self-hosted
# runner, which is a privileged container builder on a machine we own: a fork's
# code must never execute there. The trigger is pull_request, never
# pull_request_target, so a run uses the pull request's own workflow files with
# a read-only token.
#
# The image itself cannot be built here (that is the eleven legs split across
# build.yml's two image jobs, which needs the project's own runners for the
# znver3 legs). So these checks need no image:
# actionlint over the workflows, shellcheck over the shell scripts, hadolint
# over the Dockerfile, and the axis and tag scheme hack/versions.sh derives.
# hack/verify-binary.sh and hack/smoke.sh both take a built image, so nothing
# they assert can run without a build, and those checks stay in build.yml.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: actionlint, shellcheck, hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The linters are pinned by version and by the sha256 of the release
      # archive, the same way the Dockerfile pins its sources, so a PR is checked
      # by a known tool rather than by whatever is newest that day. The actionlint
      # version is the one the maintainer's local check runs
      # (`docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7`).
      - name: Install the pinned linters
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          cd "${RUNNER_TEMP}"

          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          printf '%s  %s\n' 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 actionlint.tar.gz \
            | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "${bin}/actionlint"

          curl -fsSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          printf '%s  %s\n' 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 shellcheck.tar.xz \
            | sha256sum -c -
          tar -xJf shellcheck.tar.xz -C "${bin}" --strip-components=1 shellcheck-v0.10.0/shellcheck

          curl -fsSL -o hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          printf '%s  %s\n' 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47 hadolint \
            | sha256sum -c -
          install -m 0755 hadolint "${bin}/hadolint"

          printf '%s\n' "${bin}" >> "${GITHUB_PATH}"

      - name: actionlint
        run: |
          actionlint --version
          actionlint -no-color

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck hack/*.sh entrypoint.sh qbt-unpack

      - name: hadolint
        run: |
          hadolint --version
          hadolint Dockerfile

  static:
    name: static checks (no build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # hack/versions.sh is the single source of every tag the matrix pushes, and
      # it reads the versions and axis defaults straight out of the Dockerfile.
      # These assertions are the rules the README's tags table and build matrix
      # document, and they hold for any future version bump.
      - name: Tag and axis scheme
        run: |
          set -euo pipefail

          tag() { ( eval "$(hack/versions.sh "$@")"; printf '%s\n' "${IMAGE_TAG}" ); }
          variant() { ( eval "$(hack/versions.sh "$@")"; printf '%s\n' "${VARIANT}" ); }
          immutable() {
            ( eval "$(hack/versions.sh "$@")"
              printf 'sha-0123456789ab-lt%s-%s-%s\n' "${LT_VERSION}" "${VARIANT}" "${ARCH}" )
          }

          lt12_base_amd64=$(tag musl base x86-64-v2 amd64 1.2.20)
          lt12_base_arm64=$(tag musl base armv8-a arm64 1.2.20)
          lt12_10g_amd64=$(tag musl 10g x86-64-v2 amd64 1.2.20)
          lt12_10g_arm64=$(tag musl 10g armv8-a arm64 1.2.20)
          lt12_10g_znver3=$(tag musl 10g znver3 amd64 1.2.20)
          lt12_10g_mimalloc=$(tag mimalloc 10g znver3 amd64 1.2.20)

          lt21_base_amd64=$(tag musl base x86-64-v2 amd64 2.1.2)
          lt21_base_arm64=$(tag musl base armv8-a arm64 2.1.2)
          lt21_10g_amd64=$(tag musl 10g x86-64-v2 amd64 2.1.2)
          lt21_10g_arm64=$(tag musl 10g armv8-a arm64 2.1.2)
          lt21_10g_znver3=$(tag musl 10g znver3 amd64 2.1.2)

          # The 1.2.20 line's moving tags are unchanged: they are still
          # <qbt>-lt1.2.20 with the profile, microarchitecture and allocator
          # suffixes in that order.
          [[ ${lt12_base_amd64} =~ -lt1\.2\.20$ ]]
          [[ ${lt12_base_arm64} == "${lt12_base_amd64}" ]]
          [[ ${lt12_10g_amd64} == "${lt12_base_amd64}-10g" ]]
          [[ ${lt12_10g_arm64} == "${lt12_10g_amd64}" ]]
          [[ ${lt12_10g_znver3} == "${lt12_10g_amd64}-znver3" ]]
          [[ ${lt12_10g_mimalloc} == "${lt12_10g_znver3}-mimalloc" ]]

          # The 2.1.2 line adds its own base, 10g and 10g-znver3 names, and no
          # mimalloc variant: the allocator A/B is a 1.2.20 experiment.
          [[ ${lt21_base_amd64} =~ -lt2\.1\.2$ ]]
          [[ ${lt21_base_arm64} == "${lt21_base_amd64}" ]]
          [[ ${lt21_10g_amd64} == "${lt21_base_amd64}-10g" ]]
          [[ ${lt21_10g_arm64} == "${lt21_10g_amd64}" ]]
          [[ ${lt21_10g_znver3} == "${lt21_10g_amd64}-znver3" ]]

          # Eleven matrix legs, seven moving tags, and no tag assembled by
          # accident: each line's base and 10g are one multi-arch tag shared by
          # their two arch legs, and the three znver3 legs are single images with
          # a tag each. The architecture is never part of a moving tag.
          distinct=$(printf '%s\n' \
            "${lt12_base_amd64}" "${lt12_base_arm64}" "${lt12_10g_amd64}" \
            "${lt12_10g_arm64}" "${lt12_10g_znver3}" "${lt12_10g_mimalloc}" \
            "${lt21_base_amd64}" "${lt21_base_arm64}" "${lt21_10g_amd64}" \
            "${lt21_10g_arm64}" "${lt21_10g_znver3}" | sort -u | wc -l)
          [[ ${distinct} -eq 7 ]]

          # Every leg's immutable name is distinct too: it carries the libtorrent
          # line, the variant and the arch, so neither line's base or 10g leg can
          # collide with the other line's, nor with a single-image leg.
          immutables=$(printf '%s\n' \
            "$(immutable musl base x86-64-v2 amd64 1.2.20)" \
            "$(immutable musl base armv8-a arm64 1.2.20)" \
            "$(immutable musl 10g x86-64-v2 amd64 1.2.20)" \
            "$(immutable musl 10g armv8-a arm64 1.2.20)" \
            "$(immutable musl 10g znver3 amd64 1.2.20)" \
            "$(immutable mimalloc 10g znver3 amd64 1.2.20)" \
            "$(immutable musl base x86-64-v2 amd64 2.1.2)" \
            "$(immutable musl base armv8-a arm64 2.1.2)" \
            "$(immutable musl 10g x86-64-v2 amd64 2.1.2)" \
            "$(immutable musl 10g armv8-a arm64 2.1.2)" \
            "$(immutable musl 10g znver3 amd64 2.1.2)" | sort -u | wc -l)
          [[ ${immutables} -eq 11 ]]

          # Those eleven legs are split across build.yml's two image jobs, and
          # the split has to stay a split: the eight hosted legs must not select
          # the self-hosted runner (a leg that needs no CPU feature gains
          # nothing there, and that runner is a privileged builder), and the
          # three znver3 legs must all select it, being the only ones that
          # cannot run anywhere else. The two lists together are still the
          # eleven legs asserted above, each with its own name.
          legs() {
            awk -v job="  $1:" '
              $0 == job { injob = 1; next }
              injob && /^  [a-z][a-z0-9-]*:$/ { injob = 0 }
              injob && /^ +- \{ name: / { print }
            ' .github/workflows/build.yml
          }
          hosted=$(legs image-hosted)
          znver3=$(legs image-znver3)
          hosted_legs=$(grep -c 'name:' <<< "${hosted}" || true)
          znver3_legs=$(grep -c 'name:' <<< "${znver3}" || true)
          [[ ${hosted_legs} -eq 8 ]]
          [[ ${znver3_legs} -eq 3 ]]
          [[ $((hosted_legs + znver3_legs)) -eq ${immutables} ]]
          if grep -q 'self-hosted' <<< "${hosted}"; then
            printf 'a hosted leg selects the self-hosted runner\n' >&2
            exit 1
          fi
          [[ $(grep -c 'runs_on: \[self-hosted, linux, x64, znver3\]' <<< "${znver3}" || true) -eq 3 ]]
          [[ $(printf '%s\n%s\n' "${hosted}" "${znver3}" \
            | grep -oE 'name: [a-z0-9.-]+' | sort -u | wc -l) -eq 11 ]]

          # A bad axis is an error, not a silent fallback: versions.sh validates
          # the same combinations the Dockerfile does, so it cannot assemble a tag
          # that names something the build will refuse. That includes a libtorrent
          # line with no patch pair, and mimalloc anywhere but 1.2.20.
          bad() {
            if hack/versions.sh "$@" >/dev/null 2>&1; then
              printf 'versions.sh accepted: %s\n' "$*" >&2
              exit 1
            fi
          }
          bad nope 10g x86-64-v2 amd64 1.2.20        # unknown allocator
          bad musl nah x86-64-v2 amd64 1.2.20        # unknown profile
          bad musl 10g znver4 amd64 1.2.20           # unknown march
          bad musl 10g znver3 arm64 1.2.20           # arm64 is compiled for armv8-a; MARCH is ignored there
          bad musl base armv8-a amd64 1.2.20         # armv8-a is not an amd64 target
          bad mimalloc base x86-64-v2 amd64 1.2.20   # mimalloc is the 1.2.20 10g-znver3 amd64 line only
          bad mimalloc 10g znver3 amd64 2.1.2        # ... and it is not built on 2.1.2 at all
          bad musl base x86-64-v2 amd64 2.0.9        # no patch pair for that libtorrent line

          # The variant names are the four the 1.2.20 line defines; the 2.1.2
          # line reuses three of them and adds none. Uniqueness across lines
          # comes from the libtorrent line in the immutable tag, not from the
          # variant name, so a repeated variant is expected and safe.
          variants=$(printf '%s\n' \
            "$(variant musl base x86-64-v2 amd64 1.2.20)" \
            "$(variant musl base armv8-a arm64 1.2.20)" \
            "$(variant musl 10g x86-64-v2 amd64 1.2.20)" \
            "$(variant musl 10g armv8-a arm64 1.2.20)" \
            "$(variant musl 10g znver3 amd64 1.2.20)" \
            "$(variant mimalloc 10g znver3 amd64 1.2.20)" \
            "$(variant musl base x86-64-v2 amd64 2.1.2)" \
            "$(variant musl 10g x86-64-v2 amd64 2.1.2)" \
            "$(variant musl 10g znver3 amd64 2.1.2)" | sort -u | wc -l)
          [[ ${variants} -eq 4 ]]

          printf 'tag scheme ok:\n'
          printf '  %s\n' "${lt12_base_amd64}" "${lt12_10g_amd64}" \
            "${lt12_10g_znver3}" "${lt12_10g_mimalloc}" "${lt21_base_amd64}" \
            "${lt21_10g_amd64}" "${lt21_10g_znver3}"
          printf 'legs ok: %s hosted, %s on the self-hosted runner\n' \
            "${hosted_legs}" "${znver3_legs}"
